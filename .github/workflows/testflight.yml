name: TestFlight

# Compile l'app iOS et l'envoie sur App Store Connect / TestFlight. La clé API
# App Store Connect sert à créer (au premier build) puis réutiliser un
# certificat de distribution et un profil App Store durables. Le certificat
# n'est jamais révoqué : Apple revérifie la signature lors de l'examen
# (sinon rejet ITMS-90035). Sa clé privée est gardée chiffrée dans la
# branche ci-signing, déchiffrable seulement avec le secret ASC_KEY_P8.
#
# Secrets requis (Settings › Secrets and variables › Actions) :
#   APPLE_TEAM_ID   identifiant d'équipe Apple Developer (10 caractères)
#   ASC_KEY_ID      Key ID de la clé API App Store Connect
#   ASC_ISSUER_ID   Issuer ID affiché au-dessus de la liste des clés
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXX.p8
#
# Lancement : onglet Actions › TestFlight › Run workflow, en poussant un tag
# de la forme v1.2.3, ou en poussant sur la branche testflight.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Envoyer main sur la branche « testflight » lance aussi un envoi.
    branches: [testflight]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build et envoi TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Vérifier les secrets
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY_P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installer la clé API App Store Connect
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: bash tool/check_ios_icon.sh

      # Numéro de build unique et croissant : le numéro d'exécution du workflow,
      # décalé pour rester au-dessus des builds envoyés à la main.
      - name: Préparer le projet Xcode
        run: |
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          VERSION=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          BUILD_DATE=$(TZ=Europe/Paris date +%d/%m/%Y)
          BUILD_YEAR=$(TZ=Europe/Paris date +%Y)
          set -o pipefail
          flutter build ios --release --config-only --no-codesign \
            --build-number "$BUILD_NUMBER" \
            --dart-define="APP_VERSION=$VERSION ($BUILD_NUMBER)" \
            --dart-define="BUILD_DATE=$BUILD_DATE" \
            --dart-define="BUILD_YEAR=$BUILD_YEAR" \
            2>&1 | tee "$RUNNER_TEMP/prepare.log"

      # Certificat de distribution et profil App Store durables, réutilisés
      # d'un build à l'autre (créés automatiquement au premier passage).
      - name: Récupérer la clé de signature sauvegardée
        run: |
          if git fetch -q --depth 1 origin ci-signing 2>/dev/null; then
            git show FETCH_HEAD:dist_key.enc > "$RUNNER_TEMP/dist_key.enc" || true
          fi

      - name: Préparer certificat et profil de distribution
        env:
          BUNDLE_ID: fr.semantiq.app
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          P12_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$P12_PASSWORD"
          echo "P12_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
          OUT_DIR="$RUNNER_TEMP/signing" P12_PASSWORD="$P12_PASSWORD" \
            KEY_STORE="$RUNNER_TEMP/dist_key.enc" \
            NEW_KEY_STORE="$RUNNER_TEMP/dist_key.new.enc" \
            "$RUNNER_TEMP/venv/bin/python" tool/asc_signing.py setup \
            2>&1 | tee "$RUNNER_TEMP/signing.log"

      - name: Sauvegarder la nouvelle clé de signature
        if: env.ASC_NEW_KEY != ''
        run: |
          D="$RUNNER_TEMP/ci-signing"
          mkdir -p "$D"
          cp "$ASC_NEW_KEY" "$D/dist_key.enc"
          echo "Clé privée du certificat Apple Distribution, chiffrée (AES-256-GCM) avec une clé dérivée du secret ASC_KEY_P8. Ne pas supprimer." > "$D/README"
          cd "$D"
          git init -q -b ci-signing
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "clé de signature"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-signing

      - name: Installer la signature dans un trousseau dédié
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          security import "$ASC_P12_PATH" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$ASC_PROFILE_PATH" "$d/$ASC_PROFILE_UUID.mobileprovision"
          done
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      # Signature manuelle sur la seule cible Runner (les dépendances CocoaPods
      # n'acceptent pas de profil).
      - name: Configurer la signature de la cible Runner
        run: |
          python3 - <<'PY'
          import os, re
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          team = os.environ['TEAM_ID']
          prof = os.environ['ASC_PROFILE_NAME']
          extra = (
              f'CODE_SIGN_STYLE = Manual;\n'
              f'DEVELOPMENT_TEAM = {team};\n'
              f'"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n'
              f'CODE_SIGN_IDENTITY = "Apple Distribution";\n'
              f'PROVISIONING_PROFILE_SPECIFIER = "{prof}";\n'
          )
          s, n = re.subn(r'(\n(\s*)PRODUCT_BUNDLE_IDENTIFIER = fr\.semantiq\.app;\n)',
                         lambda m: m.group(1) + ''.join(m.group(2) + l + '\n'
                                   for l in extra.strip().split('\n')),
                         s)
          s = re.sub(r'\n\s*CODE_SIGN_STYLE = Automatic;', '', s)
          print(f'{n} configuration(s) Runner signées manuellement')
          assert n > 0
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Archiver
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error|Signing Identity|Provisioning Profile|BUILD|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Exporter et envoyer sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>fr.semantiq.app</key><string>$ASC_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" "$RUNNER_TEMP/export.log"
          echo "### Build $BUILD_NUMBER envoyé sur App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Il apparaît dans TestFlight après le traitement par Apple (10 à 30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Supprimer la clé et le trousseau
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing" "$RUNNER_TEMP"/dist_key*.enc

      # En cas d'échec, les journaux (sans secret) sont déposés dans la branche
      # ci-logs pour pouvoir être lus hors de GitHub.
      - name: Publier les journaux d'échec
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          for f in prepare signing archive export; do
            [ -f "$RUNNER_TEMP/$f.log" ] && tail -n 400 "$RUNNER_TEMP/$f.log" > "$RUNNER_TEMP/logs/$f.log"
          done
          echo "run ${GITHUB_RUN_ID} ${GITHUB_SHA::7}" > "$RUNNER_TEMP/logs/README"
          cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "logs ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
